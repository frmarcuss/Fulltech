<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulltech — Presença local inteligente</title>
<style>
:root{--bg:#080e1a;--panel:#101a2b;--panel2:#142239;--line:#22334d;--text:#e9f1ff;--muted:#91a4c0;--blue:#3987ff;--cyan:#38c8e8;--green:#31c48d;--yellow:#f5b942;--red:#f06b78;--radius:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#142d52 0,transparent 38%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:252px;background:#0b1423;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 28px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 8px 24px #237cff55}.brand strong{font-size:19px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.6px;margin-top:2px}.nav-label{font-size:10px;color:#627895;font-weight:800;letter-spacing:1.4px;padding:12px 13px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9db0ca;padding:11px 13px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;font-size:13px;transition:.2s}.nav button:hover,.nav button.active{background:#172a45;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.plan{background:linear-gradient(145deg,#142c4d,#101c30);border:1px solid #29496e;border-radius:14px;padding:14px;margin:12px 5px}.plan b{font-size:12px}.plan p{font-size:11px;color:var(--muted);line-height:1.5}.plan button{background:#2c77e9;border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:11px;width:100%}.main{margin-left:252px;width:calc(100% - 252px);padding:27px 34px 50px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px;gap:16px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.search{background:#101b2c;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);width:220px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#234a7c;color:#dceaff;font-weight:700;font-size:12px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:8px}.page-head h1{font-size:27px;letter-spacing:-.8px;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.btn{border:1px solid var(--line);background:#17263d;color:var(--text);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn:hover{filter:brightness(1.16)}.btn.primary{background:linear-gradient(120deg,#2877ed,#299fe5);border-color:transparent;color:white;box-shadow:0 7px 20px #2877ed33}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:linear-gradient(145deg,#111e31,#0f1929);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;border-radius:10px;background:#1a3558;color:#67a8ff;display:grid;place-items:center}.stat-value{font-size:27px;font-weight:800;margin:13px 0 5px;letter-spacing:-1px}.stat-foot{font-size:11px;color:var(--muted)}.up{color:var(--green)}.dashboard-grid{grid-template-columns:1.5fr 1fr}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card-title h3{margin:0;font-size:14px}.muted{color:var(--muted)}.tiny{font-size:11px}.chart{height:190px;display:flex;align-items:end;gap:12px;padding:12px 4px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 46px,#20314a 47px,#20314a 48px)}.bar-wrap{flex:1;height:100%;display:flex;align-items:end;gap:4px;position:relative}.bar{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#46b8ef,#2875e8);min-width:5px;opacity:.9}.bar.alt{background:linear-gradient(180deg,#2e9cbb,#2054a3)}.months{display:flex;justify-content:space-around;color:var(--muted);font-size:10px;padding-top:9px}.activity{display:grid;gap:15px}.activity-item{display:flex;gap:11px;align-items:flex-start}.activity-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;box-shadow:0 0 0 4px #2e80ec22}.activity-item b{font-size:12px;display:block;margin-bottom:4px}.activity-item small{font-size:10px;color:var(--muted)}.table-card{padding:0;overflow:hidden}.table-head{padding:17px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.table-head h3{margin:0;font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:#8196b4;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:13px 18px;background:#111e30}td{padding:14px 18px;border-top:1px solid #1d2c42;font-size:12px;color:#cbd8eb}tbody tr:hover{background:#14233a}.biz{display:flex;align-items:center;gap:10px}.biz-logo{width:34px;height:34px;border-radius:10px;background:#1c385b;display:grid;place-items:center;color:#83bcff;font-weight:800}.biz b{display:block;color:#eef5ff;font-size:12px}.biz small{color:var(--muted);font-size:10px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:700;background:#193c35;color:#5cdbac}.status.warn{background:#49391e;color:#f7c96d}.status.bad{background:#472832;color:#ff9aa5}.score{font-weight:800;color:#63cda5}.score.mid{color:#f5c05d}.score.low{color:#ff8b99}.filters{display:flex;gap:8px;flex-wrap:wrap}.field{background:#0d1727;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 11px;font-size:12px;outline:none}.field:focus{border-color:#3987ff}.field::placeholder{color:#7185a2}.two-col{grid-template-columns:1fr 1fr}.three-col{grid-template-columns:repeat(3,1fr)}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 13px}.progress{height:7px;background:#22334b;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2879f1,#38c8e8);border-radius:10px}.issue{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #203047}.issue:last-child{border:0}.issue-icon{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#3e2e22;color:#f5bc60;display:grid;place-items:center}.issue b{font-size:12px;display:block;margin-bottom:4px}.issue p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.tag{font-size:10px;color:#8dbdff;background:#1a3557;padding:5px 8px;border-radius:7px;display:inline-block}.recommend{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #203047}.recommend:last-child{border:0}.recommend b{font-size:12px}.recommend p{font-size:11px;color:var(--muted);margin:5px 0 0;line-height:1.5}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin:10px}.modal-backdrop{position:fixed;inset:0;background:#030813bb;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{background:#101d30;border:1px solid #2a405e;border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0009}.modal h2{font-size:18px;margin:0 0 6px}.modal>p{font-size:12px;color:var(--muted);margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:11px;color:#a9bad1}.form-group input,.form-group select,.form-group textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:24px;bottom:24px;background:#173a35;border:1px solid #286b5b;color:#a8f0d4;padding:12px 16px;border-radius:11px;font-size:12px;z-index:40;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 13px;font-size:12px;white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:#fff;border-color:var(--blue)}.detail-hero{display:flex;align-items:center;gap:14px}.detail-hero .biz-logo{width:52px;height:52px;font-size:18px}.detail-hero h2{margin:0 0 4px;font-size:18px}.detail-hero p{margin:0;color:var(--muted);font-size:11px}.checkline{display:flex;align-items:center;gap:10px;font-size:12px;padding:10px 0;border-bottom:1px solid #203047}.checkline input{accent-color:var(--blue)}.report-box{background:#0c1727;border:1px solid var(--line);border-radius:12px;padding:15px}.report-box h4{font-size:12px;margin:0 0 10px}.report-box p{font-size:11px;color:var(--muted);line-height:1.6;margin:0}.mobile-head{display:none}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.search{width:170px}}
@media(max-width:720px){.sidebar{width:100%;height:62px;inset:auto 0 0;padding:5px 8px;border-right:0;border-top:1px solid var(--line);background:#0b1423}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;height:100%;gap:0}.nav button{flex:1;justify-content:center;flex-direction:column;gap:3px;padding:4px 2px;font-size:9px;border-radius:8px}.nav button .ico{font-size:17px}.nav button.active{box-shadow:inset 0 2px var(--blue)}.main{margin:0;width:100%;padding:18px 14px 85px}.topbar{margin-bottom:20px}.search{width:145px}.page-head{align-items:flex-start}.page-head h1{font-size:23px}.page-head p{font-size:12px}.page-head>.btn{font-size:0;padding:10px}.page-head>.btn span{font-size:17px}.stats{gap:10px}.card{padding:14px}.stat-value{font-size:23px}.two-col,.three-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.top-actions .crumb{display:none}.table-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters .field{flex:1;min-width:120px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">F</div><div><strong>fulltech</strong><small>LOCAL GROWTH PLATFORM</small></div></div>
 <div class="nav-label">VISÃO GERAL</div>
 <nav class="nav" id="nav">
  <button data-page="dashboard" class="active"><span class="ico">▦</span>Painel</button>
  <button data-page="businesses"><span class="ico">⌂</span>Estabelecimentos</button>
  <button data-page="audit"><span class="ico">⌕</span>Diagnóstico</button>
  <button data-page="recommendations"><span class="ico">✦</span>Recomendações</button>
  <button data-page="reports"><span class="ico">▤</span>Relatórios</button>
 </nav>
 <div class="nav-label" style="margin-top:18px">SISTEMA</div>
 <nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Configurações</button></nav>
 <div class="side-bottom"><div class="plan"><b>Espaço de demonstração</b><p>Seu ambiente está usando dados fictícios para apresentar as funcionalidades.</p><button onclick="toast('Você está no ambiente demonstrativo.')">Conhecer plataforma</button></div><div style="padding:8px 13px;color:#7185a2;font-size:10px">FULLTECH MVP · v1.0</div></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">Workspace <span style="color:#526985">/</span> <b id="crumb">Painel</b></div><div class="top-actions"><input class="search" id="globalSearch" placeholder="⌕  Buscar estabelecimento"><div class="avatar">AD</div></div></header>
 <section id="view"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const seed=[
{id:1,name:"Café Aurora",category:"Cafeteria",city:"Fortaleza",address:"Av. Dom Luís, 840",phone:"(85) 3333-1212",hours:"Seg–Sáb, 08h–20h",score:86,status:"Otimizado",products:"Cafés especiais, bolos, brunch",services:"Wi-Fi, delivery",updated:"Hoje"},
{id:2,name:"Oficina Norte",category:"Oficina mecânica",city:"Fortaleza",address:"Rua Ceará, 215",phone:"(85) 3222-9080",hours:"Seg–Sex, 08h–18h",score:58,status:"Atenção",products:"Troca de óleo, pneus, freios",services:"Diagnóstico, revisão",updated:"Ontem"},
{id:3,name:"Pet Vida",category:"Pet shop",city:"Fortaleza",address:"Av. Beira Mar, 1200",phone:"(85) 99999-1010",hours:"Seg–Dom, 09h–19h",score:72,status:"Em melhoria",products:"Rações, acessórios, higiene",services:"Banho e tosa, veterinário",updated:"Há 2 dias"},
{id:4,name:"Mercadinho São José",category:"Mercado",city:"Caucaia",address:"Rua das Flores, 45",phone:"(85) 3344-0020",hours:"Todos os dias, 07h–21h",score:41,status:"Crítico",products:"Mercearia, bebidas, hortifruti",services:"Entrega local",updated:"Há 4 dias"}
];
let businesses=JSON.parse(localStorage.getItem('ft_businesses')||'null')||seed;
let audits=JSON.parse(localStorage.getItem('ft_audits')||'null')||{};
let current='dashboard',selectedId=null,activeTab='overview';
const save=()=>localStorage.setItem('ft_businesses',JSON.stringify(businesses));
const scoreClass=n=>n>=75?'':n>=50?'mid':'low';
const statusClass=s=>s==='Otimizado'?'':s==='Crítico'?'bad':'warn';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){current=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=({dashboard:'Painel',businesses:'Estabelecimentos',audit:'Diagnóstico',recommendations:'Recomendações',reports:'Relatórios',settings:'Configurações',detail:'Estabelecimento'})[page]||page;render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function head(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function render(){let v=$('#view');if(current==='dashboard')v.innerHTML=dashboard();if(current==='businesses')v.innerHTML=businessList();if(current==='detail')v.innerHTML=detail();if(current==='audit')v.innerHTML=auditPage();if(current==='recommendations')v.innerHTML=recommendations();if(current==='reports')v.innerHTML=reports();if(current==='settings')v.innerHTML=settings();bindView()}
function dashboard(){let avg=Math.round(businesses.reduce((a,b)=>a+b.score,0)/(businesses.length||1));return `${head('CENTRAL DE CRESCIMENTO','Sua presença local, sob controle.','Acompanhe a saúde digital dos estabelecimentos e descubra onde melhorar.','<button class="btn primary" onclick="openBusiness()"><span>＋</span> Novo estabelecimento</button>')}
<div class="grid stats">
 <div class="card"><div class="stat-top">Estabelecimentos ativos <span class="stat-icon">⌂</span></div><div class="stat-value">${businesses.length}</div><div class="stat-foot"><span class="up">●</span> Em acompanhamento</div></div>
 <div class="card"><div class="stat-top">Pontuação média <span class="stat-icon">◎</span></div><div class="stat-value">${avg}<small style="font-size:13px;color:var(--muted)">/100</small></div><div class="stat-foot">Índice de presença digital</div></div>
 <div class="card"><div class="stat-top">Pontos de melhoria <span class="stat-icon">⚑</span></div><div class="stat-value">${businesses.reduce((n,b)=>n+(b.score<75?1:0),0)*3+2}</div><div class="stat-foot">Oportunidades identificadas</div></div>
 <div class="card"><div class="stat-top">Diagnósticos feitos <span class="stat-icon">⌕</span></div><div class="stat-value">${Object.keys(audits).length+12}</div><div class="stat-foot">Análises nesta demonstração</div></div>
</div>
<div class="grid dashboard-grid">
 <div class="card"><div class="card-title"><h3>Visibilidade acompanhada</h3><span class="tag">Últimos 6 meses · simulação</span></div><div class="chart">${[38,48,44,61,68,82,58,70,76,88,73,94].map((n,i)=>`<div class="bar-wrap"><div class="bar ${i%2?'alt':''}" style="height:${n}%"></div></div>`).join('')}</div><div class="months"><span>Jun</span><span>Jul</span><span>Ago</span><span>Set</span><span>Out</span><span>Nov</span></div><p class="tiny muted" style="margin:13px 0 0">Dados ilustrativos para demonstrar a evolução. O MVP ainda não consulta métricas reais de mecanismos de busca.</p></div>
 <div class="card"><div class="card-title"><h3>Atividade recente</h3><span class="muted tiny">Workspace</span></div><div class="activity"><div class="activity-item"><span class="activity-dot"></span><div><b>Diagnóstico concluído</b><small>Oficina Norte · há 2 horas</small></div></div><div class="activity-item"><span class="activity-dot" style="background:var(--green)"></span><div><b>Informações atualizadas</b><small>Café Aurora · ontem</small></div></div><div class="activity-item"><span class="activity-dot" style="background:var(--yellow)"></span><div><b>Nova oportunidade identificada</b><small>Pet Vida · há 2 dias</small></div></div><div class="activity-item"><span class="activity-dot" style="background:#9b83f5"></span><div><b>Relatório mensal disponível</b><small>Workspace · 05 nov</small></div></div></div></div>
</div>
<div class="section card table-card"><div class="table-head"><h3>Estabelecimentos acompanhados</h3><button class="btn small ghost" onclick="go('businesses')">Ver todos →</button></div>${businessTable(businesses.slice(0,4))}</div>`}
function businessTable(list){if(!list.length)return '<div class="empty">Nenhum estabelecimento encontrado.</div>';return `<div class="table-wrap"><table><thead><tr><th>Estabelecimento</th><th>Categoria</th><th>Presença</th><th>Pontuação</th><th>Atualização</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><div class="biz"><div class="biz-logo">${esc(b.name[0])}</div><div><b>${esc(b.name)}</b><small>${esc(b.city)}</small></div></div></td><td>${esc(b.category)}</td><td><span class="status ${statusClass(b.status)}">● ${esc(b.status)}</span></td><td><span class="score ${scoreClass(b.score)}">${b.score}/100</span></td><td>${esc(b.updated)}</td><td><button class="btn small" onclick="openDetail(${b.id})">Abrir →</button></td></tr>`).join('')}</tbody></table></div>`}
function businessList(){return `${head('CARTEIRA LOCAL','Estabelecimentos','Gerencie os comércios, confira os dados cadastrados e acompanhe a evolução.','<button class="btn primary" onclick="openBusiness()"><span>＋</span> Cadastrar comércio</button>')}
<div class="card" style="margin-bottom:15px"><div class="filters"><input id="bizFilter" class="field" placeholder="Buscar por nome ou cidade..." style="flex:1"><select id="statusFilter" class="field"><option value="">Todos os status</option><option>Otimizado</option><option>Em melhoria</option><option>Atenção</option><option>Crítico</option></select></div></div>
<div class="card table-card" id="bizTable">${businessTable(businesses)}</div>`}
function openDetail(id){selectedId=id;activeTab='overview';current='detail';render();$('#crumb').textContent='Estabelecimento'}
function detail(){let b=businesses.find(x=>x.id===selectedId);if(!b)return businessList();return `${head('PERFIL DO COMÉRCIO',esc(b.name),'Visão geral das informações e oportunidades de presença digital.','<button class="btn" onclick="openBusiness('+b.id+')">✎ Editar dados</button>')}
<div class="card"><div class="detail-hero"><div class="biz-logo">${esc(b.name[0])}</div><div style="flex:1"><h2>${esc(b.name)}</h2><p>${esc(b.category)} · ${esc(b.city)}</p></div><span class="status ${statusClass(b.status)}">● ${esc(b.status)}</span></div><div class="grid three-col section"><div><div class="tiny muted">Pontuação de presença</div><div class="stat-value">${b.score}<small style="font-size:12px;color:var(--muted)">/100</small></div><div class="progress"><span style="width:${b.score}%"></span></div></div><div><div class="tiny muted">Telefone</div><b style="font-size:13px">${esc(b.phone||'Não informado')}</b></div><div><div class="tiny muted">Última atualização</div><b style="font-size:13px">${esc(b.updated)}</b></div></div></div>
<div class="tabs section"><button class="${activeTab==='overview'?'active':''}" onclick="setTab('overview')">Informações</button><button class="${activeTab==='audit'?'active':''}" onclick="setTab('audit')">Diagnóstico</button><button class="${activeTab==='tasks'?'active':''}" onclick="setTab('tasks')">Plano de melhoria</button></div>
${activeTab==='overview'?`<div class="grid two-col"><div class="card"><h3>Dados do estabelecimento</h3>${[['Endereço',b.address],['Cidade',b.city],['Horário de funcionamento',b.hours],['Telefone',b.phone]].map(x=>`<div class="recommend"><div><span class="tiny muted">${x[0]}</span><p style="margin:4px 0 0;color:var(--text)">${esc(x[1]||'Não informado')}</p></div></div>`).join('')}</div><div class="card"><h3>O que o comércio oferece</h3><div class="section"><span class="tiny muted">Produtos</span><p class="tiny">${esc(b.products||'Não informado')}</p></div><div class="section"><span class="tiny muted">Serviços</span><p class="tiny">${esc(b.services||'Não informado')}</p></div><div class="section"><span class="tiny muted">Categoria principal</span><p class="tiny">${esc(b.category)}</p></div></div></div>`:activeTab==='audit'?auditDetail(b):tasksDetail(b)}
<div class="section" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="runAudit(${b.id})">⌕ Executar diagnóstico</button><button class="btn" onclick="go('reports')">Ver relatórios</button><button class="btn ghost" onclick="deleteBusiness(${b.id})">Excluir cadastro</button></div>`}
function setTab(t){activeTab=t;render()}
function auditDetail(b){let issues=issuesFor(b);return `<div class="card"><div class="card-title"><h3>Resultado da última análise</h3><span class="tag">Análise demonstrativa</span></div>${issues.map(i=>`<div class="issue"><div class="issue-icon">${i.icon}</div><div><b>${i.title}</b><p>${i.desc}</p></div></div>`).join('')}</div>`}
function tasksDetail(b){return `<div class="card"><div class="card-title"><h3>Checklist recomendado</h3><span class="tag">Plano sugerido</span></div>${['Revisar categoria principal e categorias secundárias','Completar endereço e telefone de contato','Conferir horários especiais e feriados','Adicionar produtos e serviços com descrições claras','Atualizar fotos e descrição comercial','Conferir consistência das informações em todos os canais'].map((x,i)=>`<label class="checkline"><input type="checkbox" onchange="toast('Progresso atualizado neste checklist.')"> ${x}<span class="tag" style="margin-left:auto">${i<2?'Alta':'Média'} prioridade</span></label>`).join('')}</div>`}
function issuesFor(b){let a=[];if(!b.address)a.push({icon:'⌖',title:'Endereço incompleto',desc:'Adicione rua, número e referência para facilitar a localização.'});if(!b.hours)a.push({icon:'◷',title:'Horário não informado',desc:'Informe os dias e horários de funcionamento.'});if(!b.phone)a.push({icon:'☎',title:'Contato ausente',desc:'Inclua um telefone comercial válido.'});if(b.score<75)a.push({icon:'✦',title:'Descrição comercial pouco completa',desc:'Detalhe os principais produtos, serviços e diferenciais.'});a.push({icon:'◎',title:'Oportunidade de enriquecer o perfil',desc:'Inclua fotos, atributos e respostas às dúvidas frequentes.'});return a}
function runAudit(id){let b=businesses.find(x=>x.id===id);let score=Math.min(98,Math.max(35,Math.round((b.address?15:0)+(b.phone?15:0)+(b.hours?15:0)+(b.products?20:0)+(b.services?15:0)+20)));b.score=score;b.status=score>=75?'Otimizado':score>=55?'Em melhoria':score>=45?'Atenção':'Crítico';b.updated='Agora';audits[id]=new Date().toLocaleDateString('pt-BR');save();toast('Diagnóstico demonstrativo concluído.');render()}
function auditPage(){return `${head('ANÁLISE DE PRESENÇA','Diagnóstico inteligente','Encontre dados ausentes, inconsistências e oportunidades de melhoria em cada cadastro.','<button class="btn primary" onclick="runAllAudits()">⌕ Analisar todos</button>')}
<div class="grid two-col"><div class="card"><div class="card-title"><h3>Como funciona o diagnóstico</h3><span class="tag">MVP demonstrativo</span></div><p class="muted tiny" style="line-height:1.7">A Fulltech organiza os dados fornecidos pelo comerciante e verifica a completude das informações essenciais para uma presença local consistente. Nesta demonstração, a pontuação é calculada localmente com regras simples — não representa posição real no Google ou em outro buscador.</p><div class="section">${[['Informações básicas','Nome, categoria, endereço e contato'],['Disponibilidade','Dias e horários de funcionamento'],['Oferta comercial','Produtos, serviços e diferenciais'],['Qualidade do perfil','Clareza, completude e consistência']].map(x=>`<div class="recommend"><div><b>${x[0]}</b><p>${x[1]}</p></div><span class="tag">Verificação</span></div>`).join('')}</div></div><div class="card"><h3>Distribuição de saúde digital</h3>${[['Otimizado',businesses.filter(b=>b.score>=75).length,'#31c48d'],['Em atenção',businesses.filter(b=>b.score>=50&&b.score<75).length,'#f5b942'],['Crítico',businesses.filter(b=>b.score<50).length,'#f06b78']].map(x=>`<div class="section"><div class="stat-top"><span>${x[0]}</span><b>${x[1]}</b></div><div class="progress" style="margin-top:8px"><span style="width:${businesses.length?x[1]/businesses.length*100:0}%;background:${x[2]}"></span></div></div>`).join('')}</div></div>
<div class="section card table-card"><div class="table-head"><h3>Fila de diagnóstico</h3><span class="tiny muted">${businesses.length} estabelecimentos</span></div>${businessTable(businesses)}</div>`}
function runAllAudits(){businesses.forEach(b=>runAudit(b.id));toast('Análises atualizadas para todos os estabelecimentos.')}
function recommendations(){let recs=[['Definir categoria mais específica','Uma categoria precisa ajuda o público a entender rapidamente o que o negócio oferece.','Alta','Categoria'],['Padronizar endereço e telefone','Informações consistentes reduzem dúvidas e facilitam o contato e a localização.','Alta','Dados'],['Cadastrar produtos e serviços','Descreva os itens mais procurados usando nomes que os clientes realmente pesquisam.','Alta','Conteúdo'],['Atualizar horários especiais','Mantenha horários de feriados e exceções atualizados para evitar visitas frustradas.','Média','Horários'],['Adicionar fotos recentes','Imagens reais do local, produtos e equipe ajudam a apresentar o negócio.','Média','Perfil'],['Responder dúvidas frequentes','Respostas objetivas esclarecem preços, entrega, agendamento e formas de pagamento.','Média','Relacionamento']];return `${head('PRÓXIMOS PASSOS','Recomendações práticas','Transforme os diagnósticos em ações claras para melhorar a presença digital dos comércios.')}
<div class="grid two-col"><div class="card"><div class="card-title"><h3>Oportunidades prioritárias</h3><span class="tag">Sugestões gerais</span></div>${recs.map((r,i)=>`<div class="recommend"><div><b>${i+1}. ${r[0]}</b><p>${r[1]}</p><span class="tag">${r[3]}</span></div><span class="status ${r[2]==='Alta'?'warn':''}">${r[2]}</span></div>`).join('')}</div><div class="card"><h3>Personalize por estabelecimento</h3><p class="tiny muted" style="line-height:1.6">Abra um comércio para visualizar pontos de atenção específicos e um checklist de melhoria. As recomendações são geradas com base nos campos preenchidos no cadastro.</p><div class="section">${businesses.map(b=>`<div class="recommend"><div><b>${esc(b.name)}</b><p>${esc(b.category)} · Pontuação ${b.score}/100</p></div><button class="btn small" onclick="openDetail(${b.id});setTab('tasks')">Ver plano →</button></div>`).join('')}</div></div></div>`}
function reports(){let avg=Math.round(businesses.reduce((a,b)=>a+b.score,0)/(businesses.length||1));return `${head('RESULTADOS E EVOLUÇÃO','Relatórios','Compare a situação dos cadastros e acompanhe a execução das melhorias.','<button class="btn primary" onclick="exportCSV()">↓ Exportar CSV</button>')}
<div class="grid three-col"><div class="card"><div class="stat-top">Comércios analisados</div><div class="stat-value">${businesses.length}</div><div class="stat-foot">Base cadastrada</div></div><div class="card"><div class="stat-top">Índice médio atual</div><div class="stat-value">${avg}/100</div><div class="stat-foot">Pontuação demonstrativa</div></div><div class="card"><div class="stat-top">Diagnósticos executados</div><div class="stat-value">${Object.keys(audits).length}</div><div class="stat-foot">Nesta sessão / navegador</div></div></div>
<div class="section card"><div class="card-title"><h3>Comparativo por estabelecimento</h3><span class="tag">Estado atual</span></div>${businesses.map(b=>`<div class="recommend"><div style="flex:1"><b>${esc(b.name)}</b><p>${esc(b.status)} · ${esc(b.updated)}</p><div class="progress" style="margin-top:8px"><span style="width:${b.score}%"></span></div></div><strong class="score ${scoreClass(b.score)}">${b.score}</strong></div>`).join('')}</div>
<div class="section card"><h3>Como validar o MVP no piloto</h3><div class="grid three-col section">${[['Antes','Registrar a situação inicial','Dados do perfil, categorias, horários, oferta e presença nos canais.'],['Intervenção','Aplicar melhorias','Executar as recomendações junto ao comerciante e documentar alterações.'],['Depois','Comparar resultados','Reavaliar completude, visibilidade, contatos e percepção do comerciante.']].map(x=>`<div class="report-box"><h4>${x[0]}</h4><b style="font-size:12px">${x[1]}</b><p style="margin-top:7px">${x[2]}</p></div>`).join('')}</div><p class="tiny muted" style="margin-top:14px">Importante: para medir impacto real, integre fontes como Perfil da Empresa no Google e dados de acesso/contato. O gráfico e os índices atuais são apenas exemplos visuais.</p></div>`}
function settings(){return `${head('PREFERÊNCIAS','Configurações','Ajustes do ambiente de demonstração e informações do projeto.')}
<div class="grid two-col"><div class="card"><h3>Workspace</h3><div class="form-group section"><label>Nome do projeto</label><input class="field" value="Fulltech — Presença local"></div><div class="form-group section"><label>Região principal de atuação</label><input class="field" value="Fortaleza e região metropolitana"></div><div class="form-group section"><label>Meta do piloto</label><input class="field" value="3 a 5 comércios locais"></div><button class="btn primary section" onclick="toast('Preferências salvas apenas nesta demonstração.')">Salvar preferências</button></div><div class="card"><h3>Sobre este MVP</h3><p class="tiny muted" style="line-height:1.8">A Fulltech ajuda comércios locais a melhorar a organização e a qualidade de suas informações digitais para que potenciais clientes encontrem os estabelecimentos certos.</p><div class="recommend"><div><b>Armazenamento</b><p>LocalStorage do navegador</p></div><span class="status warn">Demonstração</span></div><div class="recommend"><div><b>Integrações externas</b><p>Não conectadas nesta versão</p></div><span class="status bad">Inativo</span></div><div class="recommend"><div><b>Dados de exemplo</b><p>Podem ser alterados ou excluídos</p></div><span class="status">Editável</span></div><button class="btn section" onclick="if(confirm('Restaurar os dados de exemplo?')){businesses=[...seed.map(x=>({...x}))];audits={};save();localStorage.removeItem('ft_audits');render();toast('Dados restaurados.')}">Restaurar dados de exemplo</button></div></div>`}
function openBusiness(id=null){let b=id?businesses.find(x=>x.id===id):{};$('#modal').innerHTML=`<h2>${id?'Editar estabelecimento':'Cadastrar estabelecimento'}</h2><p>Preencha os dados essenciais para iniciar o diagnóstico de presença digital.</p><form id="bizForm"><div class="form-grid">${[['name','Nome do comércio','text',b.name],['category','Categoria principal','text',b.category],['address','Endereço completo','text',b.address],['city','Cidade','text',b.city],['phone','Telefone comercial','text',b.phone],['hours','Horário de funcionamento','text',b.hours],['products','Principais produtos','text',b.products],['services','Serviços oferecidos','text',b.services]].map((x,i)=>`<div class="form-group ${i>5?'full':''}"><label>${x[1]}${i<2?' *':''}</label><input class="field" name="${x[0]}" type="${x[2]}" value="${esc(x[3]||'')}" ${i<2?'required':''} placeholder="${x[1]}"></div>`).join('')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar cadastro</button></div></form>`;$('#modalBackdrop').classList.add('open');$('#bizForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(id){Object.assign(b,data,{updated:'Agora',status:'Em melhoria'})}else{businesses.push({id:Date.now(),...data,score:35,status:'Em melhoria',updated:'Agora'})}save();closeModal();toast('Cadastro salvo com sucesso.');render()}}
function deleteBusiness(id){if(confirm('Excluir este estabelecimento?')){businesses=businesses.filter(b=>b.id!==id);save();go('businesses');toast('Estabelecimento excluído.')}}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function bindView(){let f=$('#bizFilter');if(f){f.oninput=filterBusinesses;$('#statusFilter').onchange=filterBusinesses}}
function filterBusinesses(){let q=$('#bizFilter').value.toLowerCase(),s=$('#statusFilter').value;let list=businesses.filter(b=>(b.name+' '+b.city+' '+b.category).toLowerCase().includes(q)&&(!s||b.status===s));$('#bizTable').innerHTML=businessTable(list)}
function exportCSV(){let rows=[['Nome','Categoria','Cidade','Endereço','Telefone','Horário','Produtos','Serviços','Pontuação','Status'],...businesses.map(b=>[b.name,b.category,b.city,b.address,b.phone,b.hours,b.products,b.services,b.score,b.status])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='relatorio-fulltech.csv';a.click();URL.revokeObjectURL(a.href);toast('Relatório CSV exportado.')}
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){go('businesses');$('#bizFilter').value=e.target.value;filterBusinesses()}});
render();
</script>
</body></html>
